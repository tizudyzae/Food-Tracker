{% extends 'base.html' %}{% block body %}<h1>{{'Correct meal' if meal else 'Log a meal'}}</h1><p class="lede">Calculator mode is separate and never writes to your food log.</p><form method="post" id="meal"><label>Eating date and time<input required type="datetime-local" name="eaten_at" value="{{meal.eaten_at if meal else ''}}"></label><label>Food-day override (optional)<input type="date" name="food_day" value="{{meal.food_day if meal else ''}}"><small>Leave blank to use the {{cfg.rollover}} rollover.</small></label><label>Meal note<input name="note" value="{{meal.note if meal else ''}}" placeholder="e.g. late stir-fry"></label><h2>Foods</h2><div id="items">{% for i in (items or [none]) %}<div class="foodrow"><select name="food_id" required><option value="">Choose food…</option>{% for f in foods %}<option value="{{f.id}}" {{'selected' if i and i.food_id==f.id}}>{{f.name}} — {{f.amount|round(1)}} {{f.unit}}</option>{% endfor %}</select><input name="multiplier" type="number" min="0.01" step="0.01" value="{{i.multiplier if i else 1}}" aria-label="serving multiplier"><button type="button" onclick="this.parentElement.remove()">×</button></div>{% endfor %}</div><button type="button" class="secondary" onclick="addRow()">＋ Add food</button><div class="actions"><button name="mode" value="plan" class="secondary">Calculate only</button><button name="mode" value="confirmed">Save as eaten</button></div></form>{% if meal %}<form method="post" action="{{url_for('delete_meal',mid=meal.id)}}" onsubmit="return confirm('Delete this meal?')"><button class="danger">Delete meal</button></form>{% endif %}<script>function addRow(){let x=document.querySelector('.foodrow').cloneNode(true);x.querySelector('select').value='';x.querySelector('input').value=1;document.querySelector('#items').append(x)}</script>{% endblock %}
